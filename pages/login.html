
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de miembros | IEEE PES UTP</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="private.css">
</head>
<body>

    <main class="login-container">

        <a href="../index.html" class="login-back">
            ← Volver al inicio
        </a>

        <img
            src="../assets/logo-ieee-pes-utp.png"
            alt="IEEE PES UTP"
            class="login-logo"
        >

        <h1>Acceso de miembros</h1>
        <p>IEEE Power & Energy Society</p>

        <form id="loginForm">
            <label for="usuario">Usuario</label>
            <input
                type="text"
                id="usuario"
                placeholder="Ingrese su usuario"
                required
            >

            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                placeholder="Ingrese su contraseña"
                required
            >

            <button type="submit">Ingresar</button>

            <p id="loginMensaje"></p>
        </form>

    </main>

    <script src="private.js"></script>
</body>
</html>
